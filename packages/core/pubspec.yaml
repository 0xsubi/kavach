name: kavach_core
description: >
  Shared, platform-independent business logic for Kavach: vault item models,
  envelope-encryption crypto, the GitHub Git Data API sync engine, and the
  password generator. Deliberately has zero dependency on Flutter or dart:ui
  so it compiles to native, Wasm, and JS alike.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  sodium: ^3.4.4
  http: ^1.2.2
  meta: ^1.15.0
  uuid: ^4.5.1
  cbor: ^6.3.5

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  test: ^1.25.8
  lints: ^5.0.0
