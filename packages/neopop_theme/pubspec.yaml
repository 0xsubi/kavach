name: neopop_theme
description: >
  Kavach's design-system wrapper around CRED's neopop package: KavachButton,
  KavachCard, KavachTextField and color tokens, so every Kavach screen
  (native apps and the browser-extension popup) shares one consistent
  component set instead of ad hoc NeoPop configuration per screen.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  neopop: ^1.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Overpass Mono
      fonts:
        - asset: assets/fonts/OverpassMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/OverpassMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/OverpassMono-Bold.ttf
          weight: 700
