# Serves the compiled Flutter web build (apps/web/build/web) for Kavach's
# standalone web vault. This is a purely static file server — every API
# call goes straight from the browser to whatever kavach-storage instance
# the user configures in Settings (see kavach-storage's
# KAVACH_STORAGE_CORS_ORIGINS for the matching piece on that side). nginx
# never proxies to it, so nothing here needs to know that address.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a secrets-handling single-page app with no server-rendered
    # content and no first-party ads/embeds, so the policy can afford to be
    # tight. 'wasm-unsafe-eval' is required by both Flutter's CanvasKit
    # renderer and the bundled libsodium WASM build (sodium.js) — without
    # it the app fails to boot, not just to look wrong. connect-src is left
    # open ('*') deliberately: the user can point this at *any*
    # self-hosted kavach-storage origin at runtime via the Settings screen,
    # so there's no fixed origin to allow-list here — CORS on the
    # kavach-storage side is what actually constrains this in practice.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # No microphone/camera/geolocation use anywhere in this app — deny by
    # default rather than inherit whatever the browser's own defaults are.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/xml application/xml;
    gzip_min_length 1024;

    # Cache-Control here uses `expires`, not `add_header Cache-Control`,
    # on purpose: nginx's add_header has a sharp edge where a location
    # block that sets its own add_header silently discards every
    # add_header inherited from the server block — including the CSP and
    # other security headers above. `expires` is a separate directive
    # unaffected by that rule, so the location blocks below can set their
    # own caching without blowing away everything set above.

    # index.html is the one file that must never be cached: it's what
    # points at every hashed/versioned asset underneath it, and a stale
    # copy would keep serving an old app version indefinitely.
    location = /index.html {
        expires -1;
    }

    # flutter_service_worker.js drives Flutter's own update check — it
    # must be re-fetched every load too, or a new deployment never gets
    # picked up until the service worker's own cache separately expires.
    location = /flutter_service_worker.js {
        expires -1;
    }

    location / {
        # SPA fallback: DeviceInviteUri-carrying links land on /join, a
        # path this server has no file for — Flutter's own router (really
        # just Uri.base, read once at startup; see apps/web/lib/main.dart)
        # is what interprets it, so every unknown path must still serve
        # index.html rather than 404.
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
